<script>
/* Jembatan ke Apps Script. Kosongkan API = MODE REVIEW (data disimpan lokal di HP). */
(function(){
var API=((window.APP_CONFIG&&window.APP_CONFIG.api)||'').trim();  /* URL diisi di config.js */
var LS='supervisiHD_review_data',mem='';
function local(body,ok,fail){
  setTimeout(function(){
    try{
      if(!body){var v='';try{v=localStorage.getItem(LS)||''}catch(e){v=mem}if(ok)ok(v)}
      else if(body.action==='save'){mem=body.data;try{localStorage.setItem(LS,body.data)}catch(e){}if(ok)ok(true)}
      else{if(ok)ok(true)}
    }catch(e){if(fail)fail(e)}
  },0);
}
function call(body,ok,fail){
  if(!API)return local(body,ok,fail);
  var get=!body;
  var opt=get?{}:{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)};
  fetch(get?API+'?action=load&t='+Date.now():API,opt)
    .then(function(r){return r.json()})
    .then(function(j){if(!j.ok)throw new Error(j.error||'Server menolak');if(ok)ok(j.data)})
    .catch(function(e){if(fail)fail(e)});
}
function mk(ok,fail){return{
  withSuccessHandler:function(f){return mk(f,fail)},
  withFailureHandler:function(g){return mk(ok,g)},
  loadData:function(){call(null,ok,fail)},
  saveData:function(j){call({action:'save',data:j},ok,fail)},
  notifyKatim:function(sub,b){call({action:'notify',subject:sub,body:b},ok,fail)}
}}
window.google={script:{run:mk()}};
if(!API){var rv=document.createElement('div');rv.textContent='MODE REVIEW · data hanya di HP ini';
rv.style.cssText='position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 6px);background:#b45309;color:#fff;font-size:11px;padding:3px 9px;border-radius:99px;z-index:20;pointer-events:none;opacity:.92';
document.body.appendChild(rv)}
})();
</script>

function bulkU(){const r=$('#br').value;let n=0;$('#bt').value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(l=>{const p=l.split(/\t|\|/).map(x=>x.trim());if(!p[0]||db.users.some(u=>u.nama==p[0]&&u.role==r))return;db.users.push({id:uid(),nama:p[0],role:r,pin:'1234',nip:p[1]||'',wa:p[2]||''});n++});save();render();toast(n+' pengguna ditambahkan')}
function uu(i,k,v){db.users.find(x=>x.id==i)[k]=v;save()}function du(i){if(i==S.u){toast('Tidak bisa menghapus akun sendiri');return}db.users=db.users.filter(x=>x.id!=i);save();render()}
function sops(){const card=s=>`<div class=card><div class=row><input value="${esc(s.nama)}" style="flex:1;min-width:160px" onchange="us('${s.id}',this.value)"><input value="${esc(s.dur||'')}" style="width:90px" placeholder="Durasi" onchange="sd('${s.id}',this.value)"></div><div class=row><button class=o onclick="msp('${s.id}',-1)">▲</button><button class=o onclick="msp('${s.id}',1)">▼</button><button onclick="tg('${s.id}')">${S.ed==s.id?'Tutup tabel':'Edit poin ('+s.items.length+')'}</button><button class=d style="margin-left:auto" onclick="ds('${s.id}')">Hapus SOP</button></div>${S.ed==s.id?edTbl(s):''}</div>`;
return`<div class=card><h3>Daftar SOP & poin observasi</h3><div class=mu>Ketuk "Edit poin" pada SOP untuk mengubah tabel ceklisnya: ubah teks langsung di tabel, tambah / hapus poin, tambah langkah kerja baru, atau geser urutan dengan tombol ▲▼. Perubahan tersimpan otomatis.</div></div>${db.sops.map(card).join('')}<button onclick="const id=uid();db.sops.push({id,nama:'SOP baru',dur:'15 Menit',items:prs(TPL)});S.ed=id;save();render()">+ Tambah SOP</button>`}
const SO=id=>db.sops.find(x=>x.id==id),tg=id=>{S.ed=S.ed==id?null:id;render()};
function edTbl(s){const it=s.items,B='style="padding:2px 8px"';let rows='',gi=0,i=0;
while(i<it.length){let j=i;while(j<it.length&&it[j].g==it[i].g)j++;gi++;
for(let k=i;k<j;k++)rows+=`<tr>${k==i?`<td class=c rowspan=${j-i}>${gi}</td><td rowspan=${j-i} style="min-width:150px"><input value="${esc(it[i].g)}" style="width:100%" onchange="eg('${s.id}',${i},${j},this.value)"><div class=row><button class=o ${B} onclick="mg('${s.id}',${i},${j},-1)">▲</button><button class=o ${B} onclick="mg('${s.id}',${i},${j},1)">▼</button><button class=o ${B} onclick="ai('${s.id}',${j})">+ Poin</button><button class=d ${B} onclick="dg('${s.id}',${i},${j})">✕</button></div></td>`:''}<td><textarea style="min-height:40px;min-width:190px" onchange="et('${s.id}',${k},this.value)">${esc(it[k].t)}</textarea></td><td style="white-space:nowrap"><button class=o ${B} onclick="mv('${s.id}',${k},-1)">▲</button> <button class=o ${B} onclick="mv('${s.id}',${k},1)">▼</button> <button class=d ${B} onclick="di('${s.id}',${k})">✕</button></td></tr>`;
i=j}
return`<div class=mu style="margin:8px 0">Awali poin dengan tanda - untuk sub-poin. Huruf a, b, c di lembar dibuat otomatis.</div><div class=tw><table class=tb><tr><th>No.</th><th>Langkah Kerja</th><th>Poin yang Diobservasi</th><th>Aksi</th></tr>${rows||'<tr><td colspan=4 class=mu>Belum ada poin. Tambahkan langkah kerja di bawah.</td></tr>'}</table></div><div class=row><button onclick="ag('${s.id}')">+ Langkah kerja baru</button></div><details><summary class=mu>Tempel banyak poin sekaligus (format: Langkah|Poin)</summary><textarea onchange="ui('${s.id}',this.value)" placeholder="Persiapan Alat|Timbangan Berat Badan">${esc(it.map(x=>x.g+'|'+x.t).join('\n'))}</textarea><div class=mu>Menempel di sini akan mengganti seluruh poin SOP ini.</div></details>`}
function eg(id,i,j,v){const it=SO(id).items;for(let k=i;k<j;k++)it[k].g=v.trim();save()}
function et(id,k,v){SO(id).items[k].t=v.trim();save()}
function ai(id,p){const it=SO(id).items;it.splice(p,0,{g:it[p-1].g,t:'Poin baru'});save();render()}
function ag(id){SO(id).items.push({g:'Langkah baru',t:'Poin baru'});save();render()}
function di(id,k){if(!confirm('Hapus poin ini?'))return;SO(id).items.splice(k,1);save();render()}
function dg(id,i,j){if(!confirm('Hapus seluruh langkah kerja ini beserta poinnya?'))return;SO(id).items.splice(i,j-i);save();render()}
function mv(id,k,d){const it=SO(id).items,n=k+d;if(n<0||n>=it.length)return;const a=it[k].t;it[k].t=it[n].t;it[n].t=a;save();render()}
function mg(id,i,j,d){const it=SO(id).items;if(d<0){if(!i)return;let p=i-1;while(p>0&&it[p-1].g==it[i-1].g)p--;const b=it.splice(i,j-i);it.splice(p,0,...b)}else{if(j>=it.length)return;let e=j+1;while(e<it.length&&it[e].g==it[j].g)e++;const b=it.splice(j,e-j);it.splice(i,0,...b)}save();render()}
function msp(id,d){const a=db.sops,k=a.findIndex(x=>x.id==id),n=k+d;if(n<0||n>=a.length)return;[a[k],a[n]]=[a[n],a[k]];save();render()}
function sd(i,v){db.sops.find(x=>x.id==i).dur=v;save()}function us(i,v){db.sops.find(x=>x.id==i).nama=v;save()}function ui(i,v){db.sops.find(x=>x.id==i).items=prs(v);save();toast('Poin tersimpan');render()}function ds(i){if(!confirm('Hapus SOP ini beserta semua poinnya?'))return;db.sops=db.sops.filter(x=>x.id!=i);if(S.ed==i)S.ed=null;save();render()}
function setv(){const f=(k,l)=>`<div class=row><span style="width:150px">${l}</span><input style="flex:1" value="${esc(db.set[k])}" onchange="db.set['${k}']=this.type=='number'?+this.value:this.value;save()" ${k=='target'?'type=number':''}></div>`;
return`<div class=card><h3>Kop & pengaturan</h3>${f('k1','Kop baris 1')}${f('k2','Kop baris 2')}${f('k3','Kop baris 3')}${f('rs','Nama rumah sakit')}${f('inst','Instalasi')}${f('judul','Judul skema')}${f('target','Target kompeten (%)')}<div class=mu>Nama, NIP, dan tanda tangan di bawah ini langsung berlaku untuk semua daftar tilik.</div>${f('ki','Ka. Instalasi')}${f('kin','NIP Ka. Instalasi')}<div class=mu>Tanda tangan Ka. Instalasi (gambar di kotak, atau unggah gambar):</div>${pad('ttdKi','set')}<input type=file accept="image/*" onchange="upl(this,'ttdKi',300,90)">${f('kr','Kepala Ruangan')}${f('krn','NIP Kepala Ruangan')}<div class=mu>Tanda tangan Kepala Ruangan:</div>${pad('ttdKr','set')}<input type=file accept="image/*" onchange="upl(this,'ttdKr',300,90)"></div><div class=card><h3>Label peran</h3><div class=mu>Nama jabatan yang tampil di aplikasi. Alur: KA Tim/PP menyupervisi Perawat Pelaksana, sedangkan KA Tim/PP disupervisi oleh Kepala Ruangan.</div>${['perawat','katim','karu','admin'].map(r=>`<div class=row><span style="width:150px">${r}</span><input style="flex:1" value="${esc(RL(r))}" onchange="(db.set.rl=db.set.rl||{})['${r}']=this.value;save()"></div>`).join('')}</div><div class=card><h3>Logo kop</h3><img src="${db.set.logo||LOGO}" style="height:70px;display:block"><input type=file accept="image/*" onchange="upl(this,'logo',260,260)"></div>`}
function bk(){return`<div class=card><h3>Cadangan data</h3><div class=mu>Salin teks ini dan simpan (mis. di Google Drive). Untuk memulihkan, tempel di kotak bawah.</div><textarea readonly onclick=this.select()>${esc(JSON.stringify(db))}</textarea><h3>Pulihkan</h3><textarea id=imp></textarea><button onclick="try{db=JSON.parse($('#imp').value);save();toast('Data dipulihkan');S.u=null;render()}catch(e){toast('Format tidak valid')}">Pulihkan</button></div>`}
$('#app').innerHTML='<div class=card style="max-width:340px;margin:60px auto;text-align:center">Memuat data dari Google Drive…</div>';google.script.run.withSuccessHandler(boot).withFailureHandler(e=>{$('#app').innerHTML='<div class=card>Gagal memuat data: '+esc(e&&e.message)+'</div>'}).loadData();
</script><script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}});
}
